<svg width="1400" height="860" viewBox="0 0 1400 860" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="150" y1="80" x2="1240" y2="760" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFF5ED"/>
      <stop offset="1" stop-color="#F4F8FB"/>
    </linearGradient>
    <linearGradient id="cardA" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#FFF8F0"/>
      <stop offset="1" stop-color="#FFFDFB"/>
    </linearGradient>
    <linearGradient id="cardB" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#F6FBFF"/>
      <stop offset="1" stop-color="#FFFFFF"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#172126" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="7" orient="auto">
      <path d="M1 1L11 7L1 13" stroke="#2D3940" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      .title { font: 700 46px Georgia, 'Times New Roman', serif; fill: #172126; }
      .subtitle { font: 500 22px Georgia, 'Times New Roman', serif; fill: #5E6A72; }
      .cardTitle { font: 700 24px Arial, sans-serif; fill: #172126; }
      .body { font: 500 18px Arial, sans-serif; fill: #38444B; }
      .small { font: 600 15px Arial, sans-serif; fill: #5E6A72; letter-spacing: 0.08em; text-transform: uppercase; }
      .pill { font: 700 16px Arial, sans-serif; fill: #FFFFFF; }
      .mono { font: 600 17px 'Courier New', monospace; fill: #243239; }
    </style>
  </defs>

  <rect x="24" y="24" width="1352" height="812" rx="34" fill="url(#bg)"/>

  <text x="76" y="98" class="title">Trajectory-Induced Subspaces</text>
  <text x="76" y="132" class="subtitle">A personal learning and exploratory workbench for scanning LLM reasoning geometry</text>

  <rect x="76" y="182" width="390" height="266" rx="28" fill="url(#cardA)" stroke="#E7D5C6" stroke-width="2" filter="url(#shadow)"/>
  <text x="108" y="230" class="small">Static View</text>
  <text x="108" y="268" class="cardTitle">Semantic Manifold</text>
  <text x="108" y="306" class="body">Spatial Semantomics builds a baseline map:</text>
  <text x="108" y="338" class="body">• embeddings</text>
  <text x="108" y="370" class="body">• kNN graph</text>
  <text x="108" y="402" class="body">• semantic axes</text>
  <text x="108" y="434" class="body">• domain segmentation</text>
  <circle cx="380" cy="312" r="26" fill="#D06235"/>
  <circle cx="333" cy="356" r="20" fill="#E5A17E"/>
  <circle cx="407" cy="380" r="17" fill="#EACCB9"/>
  <circle cx="356" cy="405" r="13" fill="#C4542D"/>
  <path d="M314 330C340 314 359 303 383 287" stroke="#C4542D" stroke-width="3" stroke-linecap="round"/>
  <path d="M344 373C365 371 381 374 396 381" stroke="#D9865F" stroke-width="3" stroke-linecap="round"/>

  <rect x="506" y="182" width="390" height="266" rx="28" fill="url(#cardB)" stroke="#D4E3EC" stroke-width="2" filter="url(#shadow)"/>
  <text x="538" y="230" class="small">Dynamic View</text>
  <text x="538" y="268" class="cardTitle">Reasoning Trajectory</text>
  <text x="538" y="306" class="body">TIS tracks step-to-step motion:</text>
  <text x="538" y="338" class="body">• thought → embedding</text>
  <text x="538" y="370" class="body">• delta vectors</text>
  <text x="538" y="402" class="body">• residuals after static projection</text>
  <text x="538" y="434" class="body">• cluster / path / phase analysis</text>
  <path d="M702 316C735 286 755 270 780 258C798 250 812 251 823 266C835 282 831 302 815 316C799 330 783 339 768 349C748 363 736 382 748 401C758 417 781 420 799 412C819 403 832 385 838 361" stroke="#2F6F8F" stroke-width="6" stroke-linecap="round"/>
  <circle cx="703" cy="316" r="9" fill="#2F6F8F"/>
  <circle cx="760" cy="275" r="9" fill="#57A5C7"/>
  <circle cx="815" cy="316" r="9" fill="#2F6F8F"/>
  <circle cx="754" cy="408" r="9" fill="#57A5C7"/>
  <circle cx="838" cy="361" r="9" fill="#2F6F8F"/>

  <rect x="936" y="182" width="388" height="266" rx="28" fill="#FFFDFB" stroke="#D8D7D4" stroke-width="2" filter="url(#shadow)"/>
  <text x="968" y="230" class="small">Bridge</text>
  <text x="968" y="268" class="cardTitle">Static vs Dynamic Comparison</text>
  <text x="968" y="306" class="body">The central test asks:</text>
  <text x="968" y="344" class="mono">static axes enough?</text>
  <text x="968" y="382" class="mono">or residual local geometry?</text>
  <rect x="968" y="404" width="146" height="34" rx="17" fill="#172126"/>
  <text x="993" y="426" class="pill">manifold following</text>
  <rect x="1130" y="404" width="170" height="34" rx="17" fill="#C4542D"/>
  <text x="1154" y="426" class="pill">local structure formation</text>

  <path d="M467 316H494" stroke="#2D3940" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M897 316H924" stroke="#2D3940" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="76" y="500" width="1248" height="268" rx="28" fill="#FFFDF9" stroke="#E0DACE" stroke-width="2" filter="url(#shadow)"/>
  <text x="110" y="548" class="small">Current Reading</text>
  <text x="110" y="586" class="cardTitle">What the project currently thinks is happening</text>

  <rect x="112" y="622" width="218" height="96" rx="22" fill="#F8E3D8"/>
  <text x="136" y="656" class="body">1. Prompt family places</text>
  <text x="136" y="684" class="body">the model in a broad</text>
  <text x="136" y="712" class="body">semantic neighborhood.</text>

  <rect x="370" y="622" width="218" height="96" rx="22" fill="#E4F0F6"/>
  <text x="394" y="656" class="body">2. The trace enters</text>
  <text x="394" y="684" class="body">a local residual</text>
  <text x="394" y="712" class="body">regime.</text>

  <rect x="628" y="622" width="218" height="96" rx="22" fill="#EFEADB"/>
  <text x="652" y="656" class="body">3. Early / middle / late</text>
  <text x="652" y="684" class="body">phases define a path</text>
  <text x="652" y="712" class="body">through that regime.</text>

  <rect x="886" y="622" width="192" height="96" rx="22" fill="#F2E1E8"/>
  <text x="910" y="656" class="body">4. Correct and</text>
  <text x="910" y="684" class="body">incorrect traces often</text>
  <text x="910" y="712" class="body">follow different paths.</text>

  <rect x="1118" y="622" width="172" height="96" rx="22" fill="#E6F1EA"/>
  <text x="1142" y="656" class="body">5. Static axes help,</text>
  <text x="1142" y="684" class="body">but do not explain</text>
  <text x="1142" y="712" class="body">the motion alone.</text>

  <path d="M330 670H360" stroke="#2D3940" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M588 670H618" stroke="#2D3940" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M846 670H876" stroke="#2D3940" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M1078 670H1108" stroke="#2D3940" stroke-width="3" marker-end="url(#arrow)"/>
</svg>
